
name: Daily Lesson Post

# Yeh workflow har roz 3:00 PM Pakistan time par chalta hai.
# Day 1-30: pehle se likhe hue lessons/day-XX.md files post hoti hain.
# Day 31 se aage: agar file maujood nahi to Gemini AI khud us din ka
# lesson likh kar post karega aur lessons folder mein save bhi kar dega.
on:
  schedule:
    # 3:00 PM PKT (Pakistan) = 10:00 UTC  (PKT = UTC+5)
    - cron: '0 10 * * *'
  workflow_dispatch:  # Manual "Run workflow" button ke liye bhi

permissions:
  contents: write   # zaroori hai taake workflow counter/generated file save kar sake

jobs:
  send-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karein
        uses: actions/checkout@v4

      - name: Agla lesson number nikalein
        id: next
        run: |
          if [ -f lessons/.last-posted ]; then
            LAST=$(cat lessons/.last-posted)
          else
            LAST=0
          fi
          NEXT=$((LAST + 1))
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Aaj ka lesson number: $NEXT"

      - name: Agar lesson file maujood nahi to Gemini se generate karein
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          PADDED=$(printf "%02d" "$NEXT")
          FILE="lessons/day-${PADDED}.md"
          if [ -f "$FILE" ]; then
            echo "Pehle se likhi hui file mil gayi: $FILE"
            exit 0
          fi
          echo "File nahi mili — Gemini AI se Day $NEXT ka lesson generate kar rahe hain..."
          PROMPT_TEXT="Tum FKC Trading Academy ke liye ek coding/business teacher ho. Advanced students (teenagers) ke liye Roman Urdu/Hindi mein Day ${NEXT} ka lesson likho. Course ka safar: Day 1-30 Python coding tha (accounting software tak). Ab Day 31 se aage e-commerce (Amazon, Daraz, Shopify) aur phir trading/markets ke topics cover karo, seedhe seedhe order mein, ek din mein ek chhota topic. Format bilkul yeh follow karo: '# Day ${NEXT} — <Title>' phir '**Concept:**' (2-3 lines), '**Chota Example:**' (agar coding ho to code block, warna real misal), '**Practice:**' (1 kaam jo student khud karega), '**Mini Project:**' (1 chhota project). Total length Telegram message ke liye chhoti rakho (max ~500 words). Sirf lesson content do, koi extra intro ya outro nahi."
          jq -n --arg prompt "$PROMPT_TEXT" '{contents: [{parts: [{text: $prompt}]}]}' > /tmp/gemini_body.json
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}" -H 'Content-Type: application/json' -d @/tmp/gemini_body.json > /tmp/gemini_raw.json
          GENERATED_TEXT=$(jq -r '.candidates[0].content.parts[0].text // empty' /tmp/gemini_raw.json)
          if [ -z "$GENERATED_TEXT" ]; then
            echo "Gemini se text nahi mila, raw response:"
            cat /tmp/gemini_raw.json
            echo "Day ${NEXT} ka lesson aaj generate nahi ho saka — kal phir koshish hogi." > "$FILE"
          else
            echo "$GENERATED_TEXT" > "$FILE"
            echo "Lesson generate ho gaya aur save ho gaya: $FILE"
          fi

      - name: Lesson file bhejein Telegram par
        id: send
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          PADDED=$(printf "%02d" "$NEXT")
          FILE="lessons/day-${PADDED}.md"
          if [ -f "$FILE" ]; then
            TEXT=$(cat "$FILE")
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d parse_mode="Markdown" \
              --data-urlencode text="$TEXT"
            echo "$NEXT" > lessons/.last-posted
            echo "sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "Day $NEXT ka lesson kisi tarah nahi mila/bana — kal phir try hoga."
            echo "sent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Naye/generated files aur counter save karein
        if: steps.send.outputs.sent == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lessons/
          git commit -m "Posted lesson day ${{ steps.next.outputs.next }}"
          git push
