name: Daily Course Lessons

on:
  schedule:
    - cron: "0 10 * * *"   # 3:00 PM Pakistan Time (PKT = UTC+5)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create-lessons:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install karo
        run: pip install -r requirements.txt

      - name: Har course ka daily lesson generate karo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          TELEGRAM_CHANNEL_LINK: ${{ secrets.TELEGRAM_CHANNEL_LINK }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_post.py

      - name: Changes commit aur push karo
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Daily lessons: $(date +'%d-%m-%Y %H:%M')" || echo "Kuch naya nahi hai"
          git pull --rebase
          git push
