<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FKC Trading Academy — Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #EDECE4;
    --paper: #0B1220;
    --panel: #111a2b;
    --line: #22304a;
    --gold: #D4A73A;
    --green: #3FB68B;
    --red: #E2574C;
    --muted: #93a0b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  .ticker {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--gold);
    letter-spacing: 0.08em;
    font-size: 14px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 24px;
  }
  .ticker .sym { font-weight: 600; }
  .ticker .lbl { color: var(--muted); font-weight: 400; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.15;
    margin: 0 0 28px;
    color: var(--ink);
  }
  .lesson-block { margin-bottom: 44px; }
  .lesson-block:not(:first-child) { padding-top: 36px; border-top: 1px dashed var(--line); }
  .lesson-block h1 { font-size: 26px; margin-bottom: 20px; }
  .latest-tag {
    display: inline-block;
    background: var(--gold);
    color: #0B1220;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    margin-bottom: 10px;
  }
  h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 18px;
    color: var(--gold);
    margin: 22px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  p { margin: 8px 0; color: var(--ink); font-size: 15px; }
  pre {
    background: #060a12;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px;
    overflow-x: auto;
    font-size: 13.5px;
  }
  code { font-family: 'IBM Plex Mono', monospace; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    border-radius: 6px;
    padding: 20px 22px;
    margin-bottom: 22px;
  }
  .card.assignment { border-left-color: var(--green); }
  .card.assignment h2 { color: var(--green); }
  h2 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    margin: 0 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  textarea {
    width: 100%;
    min-height: 110px;
    background: #060a12;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 12px;
    resize: vertical;
  }
  input[type=text] {
    width: 100%;
    background: #060a12;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--gold);
    color: #0B1220;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    padding: 12px 18px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn.green { background: var(--green); }
  .btn:active { transform: translateY(1px); }
  footer { color: var(--muted); font-size: 12px; margin-top: 40px; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ticker">
      <span class="sym">FKC</span>
      <span class="lbl">daily lessons — archive</span>
    </div>
    <div id="lessons-container"></div>
    <footer>FKC Trading Academy — automatically updated</footer>
  </div>

<script>
/* ============================================================
   LESSON DATA
   Naya lesson add karne ke liye: neeche "lessons" array ke
   SABSE UPAR (index 0 se pehle) ek naya object add karein.
   Purane lessons ko chhedein mat — wo apne aap neeche
   list ho jaayenge. Sabse pehla (top) object = latest lesson.
   ============================================================ */
const lessons = [
  {
    day: "02",
    title: "Day 2 — Variables",
    concept: "Variable ek dabba hai jisme value store hoti hai",
    example: `naam = "Ali"
  age = 10
  print(naam, "ki age", age, "saal hai")`,
    practice: "Apna naam, age, favorite color variables mein store karke print karwayen",
    miniProject: `"Digital ID Card" banwayen (naam, age, class, roll number)`
  },
  {
    day: "01",
    title: "Day 1 — Introduction",
    concept: "Trading seekhne ka pehla kadam — basics samajhna",
    example: `print("Welcome to FKC Trading Academy")`,
    practice: "Apna trading goal ek line mein likhein",
    miniProject: `Apna "Trading Journal" ka pehla page banwayen (naam, goal, target)`
  }
];

const container = document.getElementById('lessons-container');

lessons.forEach((lesson, index) => {
  const isLatest = index === 0;

  const waText = `Day ${lesson.day} — ${lesson.title.split('—')[1] ? lesson.title.split('—')[1].trim() : lesson.title}\n\n-\n\nConcept:\n${lesson.concept}\n-\n\nExample:\n\`\`\`python\n  ${lesson.example}\n  \`\`\`\n-\n\nPractice:\n${lesson.practice}\n-\n\nMini Project:\n${lesson.miniProject}`;

  const block = document.createElement('div');
  block.className = 'lesson-block';
  block.innerHTML = `
    ${isLatest ? '<span class="latest-tag">Latest</span>' : ''}
    <h1>${lesson.title}</h1>
    <div class="card lesson">
      <p>-</p><h3>Concept</h3>
      <p>${lesson.concept}<br>-</p><h3>Example</h3>
      <pre><code>${lesson.example.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
      <p>-</p>
      <a class="btn" href="https://wa.me/?text=${encodeURIComponent(waText)}" target="_blank" rel="noopener">Share lesson on WhatsApp</a>
    </div>
    <div class="card assignment">
      <h2>Assignment</h2>
      <div class="sub">Aaj ka kaam — mukammal karke neeche apna jawab likhein aur WhatsApp par group ko bhej dein.</div>
      <h3>Practice</h3>
      <p>${lesson.practice}<br>-</p><h3>Mini Project</h3>
      <p>${lesson.miniProject}</p>
      <input type="text" id="student-name-${lesson.day}" placeholder="Apna naam likhein">
      <textarea id="student-answer-${lesson.day}" placeholder="Apna code ya jawab yahan paste/likhein..."></textarea>
      <br>
      <button class="btn green" onclick="submitAssignment('${lesson.day}')">Send via WhatsApp</button>
    </div>
  `;
  container.appendChild(block);
});

const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbx1UBGM5GyFx4xYOIt5BbRE0k-LaURaZXXwuU3hJWYTYq3fEMiFGeb68gdXtutKJmBi/exec";

function submitAssignment(day) {
  const name = document.getElementById('student-name-' + day).value.trim() || 'Student';
  const answer = document.getElementById('student-answer-' + day).value.trim();
  if (!answer) { alert('Pehle apna jawab likhein.'); return; }

  if (SHEET_WEBHOOK_URL) {
    const formData = new URLSearchParams();
    formData.append('day', day);
    formData.append('name', name);
    formData.append('answer', answer);
    fetch(SHEET_WEBHOOK_URL, { method: 'POST', mode: 'no-cors', body: formData }).catch(() => {});
  }

  const text = "Day " + day + " Assignment — " + name + ":\n\n" + answer;
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}
</script>
</body>
</html>
